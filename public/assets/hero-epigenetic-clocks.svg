<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="資訊圖：左側是以甲基化位點作為刻度的時鐘，右側列出三代表觀遺傳時鐘模型——第一代 Horvath 估算實際年齡、第二代 PhenoAge 與 GrimAge 預測死亡風險、第三代 DunedinPACE 測量老化速率">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#08122a"/>
    <stop offset="0.55" stop-color="#0d1e3d"/>
    <stop offset="1" stop-color="#0a1730"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#a186e0" stop-opacity="0.26"/>
    <stop offset="1" stop-color="#a186e0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4fa8e8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#4fa8e8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc9e8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc9e8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#4fc9e8" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:58px;font-weight:800;fill:#f2f7ff}
  .h2{font-size:30px;font-weight:500;fill:#6fd7ea;letter-spacing:3px}
  .gen{font-size:37px;font-weight:700;fill:#eaf2ff}
  .desc{font-size:26px;fill:#93accd}
  .tag{font-size:26px;font-weight:700;fill:#0b1a33}
  .cap{font-size:26px;fill:#93accd}
  .core{font-size:30px;font-weight:700;fill:#bfe9f5}
</style>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="400" cy="600" rx="520" ry="420" fill="url(#glowA)"/>
<ellipse cx="1200" cy="300" rx="560" ry="380" fill="url(#glowB)"/>

<text class="h1" x="800" y="104" text-anchor="middle">表觀遺傳時鐘：三代模型在算什麼</text>
<text class="h2" x="800" y="158" text-anchor="middle">EPIGENETIC CLOCKS</text>
<rect x="420" y="188" width="760" height="3" fill="url(#rule)"/>

<!-- 時鐘 -->
<g filter="url(#soft)">
  <circle cx="400" cy="590" r="212" fill="#0c2242" stroke="#4fc9e8" stroke-width="5"/>
  <circle cx="400" cy="590" r="176" fill="none" stroke="#24466f" stroke-width="2"/>
</g>
<!-- 刻度＝CpG 甲基化位點，實心為已甲基化 -->
<g filter="url(#soft2)">
  <circle cx="400" cy="400" r="13" fill="#2fd0b6"/>
  <circle cx="495" cy="425" r="13" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  <circle cx="565" cy="495" r="13" fill="#2fd0b6"/>
  <circle cx="590" cy="590" r="13" fill="#2fd0b6"/>
  <circle cx="565" cy="685" r="13" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  <circle cx="495" cy="755" r="13" fill="#2fd0b6"/>
  <circle cx="400" cy="780" r="13" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  <circle cx="305" cy="755" r="13" fill="#2fd0b6"/>
  <circle cx="235" cy="685" r="13" fill="#2fd0b6"/>
  <circle cx="210" cy="590" r="13" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  <circle cx="235" cy="495" r="13" fill="#2fd0b6"/>
  <circle cx="305" cy="425" r="13" fill="none" stroke="#4fc9e8" stroke-width="3"/>
</g>
<g stroke="#f0b45a" stroke-linecap="round" filter="url(#soft2)">
  <path d="M400 590 L 318 508" stroke-width="11"/>
  <path d="M400 590 L 496 512" stroke-width="7"/>
</g>
<circle cx="400" cy="590" r="14" fill="#f0b45a"/>
<text class="core" x="400" y="866" text-anchor="middle">刻度＝DNA 甲基化位點</text>

<!-- 三代模型 -->
<g>
  <rect x="760" y="300" width="780" height="150" rx="18" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
  <rect x="760" y="300" width="9" height="150" rx="4.5" fill="#4fc9e8"/>
  <rect x="800" y="330" width="132" height="44" rx="22" fill="#4fc9e8"/>
  <text class="tag" x="866" y="361" text-anchor="middle">第一代</text>
  <text class="gen" x="950" y="364">Horvath</text>
  <text class="desc" x="800" y="418">用甲基化位點回歸「實際年齡」</text>

  <rect x="760" y="480" width="780" height="150" rx="18" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
  <rect x="760" y="480" width="9" height="150" rx="4.5" fill="#2fd0b6"/>
  <rect x="800" y="510" width="132" height="44" rx="22" fill="#2fd0b6"/>
  <text class="tag" x="866" y="541" text-anchor="middle">第二代</text>
  <text class="gen" x="950" y="544">PhenoAge · GrimAge</text>
  <text class="desc" x="800" y="598">改以死亡與疾病風險為訓練目標</text>

  <rect x="760" y="660" width="780" height="150" rx="18" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
  <rect x="760" y="660" width="9" height="150" rx="4.5" fill="#f0b45a"/>
  <rect x="800" y="690" width="132" height="44" rx="22" fill="#f0b45a"/>
  <text class="tag" x="866" y="721" text-anchor="middle">第三代</text>
  <text class="gen" x="950" y="724">DunedinPACE</text>
  <text class="desc" x="800" y="778">測的是「老化速率」而非年齡</text>
</g>

<text class="cap" x="800" y="946" text-anchor="middle">模型算的是族群統計關聯，不是個人健康分數</text>
</svg>
