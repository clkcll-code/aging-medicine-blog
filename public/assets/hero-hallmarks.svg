<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="資訊圖：老化的十二個標誌依原發性、拮抗性、整合性三層分類排列，其中巨自噬失能、慢性發炎與微生物相失衡為 2023 年新增">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#08122a"/>
    <stop offset="0.55" stop-color="#0d1e3d"/>
    <stop offset="1" stop-color="#0a1730"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4fa8e8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#4fa8e8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ef6f9a" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#ef6f9a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc9e8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc9e8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#4fc9e8" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:58px;font-weight:800;fill:#f2f7ff}
  .h2{font-size:30px;font-weight:500;fill:#6fd7ea;letter-spacing:3px}
  .col{font-size:36px;font-weight:800;fill:#0b1a33}
  .colsub{font-size:24px;fill:#93accd}
  .item{font-size:30px;font-weight:600;fill:#eaf2ff}
  .cap{font-size:26px;fill:#93accd}
  .star{font-size:28px;font-weight:700;fill:#f0b45a}
</style>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="400" cy="300" rx="560" ry="380" fill="url(#glowA)"/>
<ellipse cx="1200" cy="750" rx="560" ry="380" fill="url(#glowB)"/>

<text class="h1" x="800" y="104" text-anchor="middle">老化的十二個標誌</text>
<text class="h2" x="800" y="158" text-anchor="middle">HALLMARKS OF AGING · 2023</text>
<rect x="420" y="188" width="760" height="3" fill="url(#rule)"/>

<!-- 第一欄：原發性 -->
<g>
  <rect x="60" y="238" width="470" height="70" rx="35" fill="#4fc9e8"/>
  <text class="col" x="295" y="285" text-anchor="middle">原發性 · 5</text>
  <text class="colsub" x="295" y="344" text-anchor="middle">純粹的損害，只有壞處</text>

  <g>
    <rect x="60" y="376" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="96" y="419">基因體不穩定</text>
    <rect x="60" y="456" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="96" y="499">端粒磨損</text>
    <rect x="60" y="536" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="96" y="579">表觀遺傳改變</text>
    <rect x="60" y="616" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="96" y="659">蛋白質恆定失衡</text>
    <rect x="60" y="696" width="470" height="66" rx="14" fill="#102a4d" stroke="#f0b45a" stroke-width="2"/>
    <text class="item" x="96" y="739">巨自噬失能</text>
    <text class="star" x="494" y="740" text-anchor="end">★</text>
  </g>
</g>

<!-- 第二欄：拮抗性 -->
<g>
  <rect x="565" y="238" width="470" height="70" rx="35" fill="#2fd0b6"/>
  <text class="col" x="800" y="285" text-anchor="middle">拮抗性 · 3</text>
  <text class="colsub" x="800" y="344" text-anchor="middle">原是保護反應，過頭才有害</text>

  <g>
    <rect x="565" y="376" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="601" y="419">營養感知失調</text>
    <rect x="565" y="456" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="601" y="499">粒線體功能障礙</text>
    <rect x="565" y="536" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="601" y="579">細胞衰老</text>
  </g>
</g>

<!-- 第三欄：整合性 -->
<g>
  <rect x="1070" y="238" width="470" height="70" rx="35" fill="#a186e0"/>
  <text class="col" x="1305" y="285" text-anchor="middle">整合性 · 4</text>
  <text class="colsub" x="1305" y="344" text-anchor="middle">組織與個體層次的後果</text>

  <g>
    <rect x="1070" y="376" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="1106" y="419">幹細胞耗竭</text>
    <rect x="1070" y="456" width="470" height="66" rx="14" fill="#102a4d" stroke="#24466f" stroke-width="2"/>
    <text class="item" x="1106" y="499">細胞間通訊改變</text>
    <rect x="1070" y="536" width="470" height="66" rx="14" fill="#102a4d" stroke="#f0b45a" stroke-width="2"/>
    <text class="item" x="1106" y="579">慢性發炎</text>
    <text class="star" x="1504" y="580" text-anchor="end">★</text>
    <rect x="1070" y="616" width="470" height="66" rx="14" fill="#102a4d" stroke="#f0b45a" stroke-width="2"/>
    <text class="item" x="1106" y="659">微生物相失衡</text>
    <text class="star" x="1504" y="660" text-anchor="end">★</text>
  </g>
</g>

<text class="cap" x="800" y="892" text-anchor="middle">★ 為 2023 年新增 — 三項都不侷限在單一細胞之內</text>
<text class="cap" x="800" y="940" text-anchor="middle">分層不只是排版，而是介入策略的分野</text>
</svg>
