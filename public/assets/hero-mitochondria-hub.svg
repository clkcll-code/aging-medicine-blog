<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="科學插畫：中央為立體渲染的粒線體，可見外膜、內膜與嵴的摺疊結構，向外連接產能、代謝樞紐、發炎訊號與細胞命運四個功能節點">
<defs>
  <!-- 背景：中央亮、邊緣暗的星雲式漸層 -->
  <radialGradient id="bg" cx="0.5" cy="0.46" r="0.78">
    <stop offset="0" stop-color="#16345f"/>
    <stop offset="0.45" stop-color="#0d1e3c"/>
    <stop offset="1" stop-color="#050a17"/>
  </radialGradient>
  <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2b7fb8" stop-opacity="0.30"/>
    <stop offset="1" stop-color="#2b7fb8" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#e0722c" stop-opacity="0.26"/>
    <stop offset="1" stop-color="#e0722c" stop-opacity="0"/>
  </radialGradient>

  <!-- 粒線體本體：暖色體積漸層 -->
  <linearGradient id="mitoBody" x1="0.15" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#ffd39a"/>
    <stop offset="0.3" stop-color="#f9b064"/>
    <stop offset="0.55" stop-color="#e8823a"/>
    <stop offset="0.85" stop-color="#bf5326"/>
    <stop offset="1" stop-color="#8e3a1e"/>
  </linearGradient>
  <radialGradient id="mitoSheen" cx="0.34" cy="0.24" r="0.55">
    <stop offset="0" stop-color="#fff6e6" stop-opacity="0.70"/>
    <stop offset="0.55" stop-color="#ffd9a8" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#ffd9a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="crista" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#123059"/>
    <stop offset="0.5" stop-color="#0a1c38"/>
    <stop offset="1" stop-color="#132f56"/>
  </linearGradient>
  <linearGradient id="cristaEdge" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffcf96" stop-opacity="0.55"/>
    <stop offset="1" stop-color="#ffcf96" stop-opacity="0.10"/>
  </linearGradient>

  <radialGradient id="satFill" cx="0.35" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#1d3a68"/>
    <stop offset="1" stop-color="#081326"/>
  </radialGradient>

  <filter id="bloom" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="22" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="bloomS" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="blurOnly" x="-70%" y="-70%" width="240%" height="240%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <!-- 細顆粒噪點，打破向量的塑膠感 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <clipPath id="bodyClip">
    <path d="M530 545 C530 450 610 405 720 402 C830 399 960 404 1030 440
             C1085 469 1098 545 1078 600 C1052 668 940 692 810 692
             C690 692 590 680 552 634 C530 606 530 575 530 545 Z"/>
  </clipPath>

  <marker id="arw" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 1 L10 6 L0 11 z" fill="#7fb4dd"/>
  </marker>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:60px;font-weight:800;fill:#f4f8ff;letter-spacing:1px}
  .h2{font-size:29px;font-weight:500;fill:#7fd3e8;letter-spacing:4px}
  .lbl{font-size:34px;font-weight:700;fill:#eef4ff}
  .sub{font-size:24px;fill:#8fa9cc}
  .core{font-size:30px;font-weight:700;fill:#ffd9a8;letter-spacing:2px}
  .cap{font-size:25px;fill:#8fa9cc}
</style>

<rect width="1600" height="1000" fill="url(#bg)"/>
<ellipse cx="1230" cy="220" rx="560" ry="380" fill="url(#nebulaA)"/>
<ellipse cx="800" cy="560" rx="620" ry="400" fill="url(#nebulaB)"/>

<!-- 背景微粒 -->
<g fill="#9fd4ec">
  <circle cx="180" cy="200" r="3" opacity="0.5"/><circle cx="1440" cy="180" r="2.5" opacity="0.4"/>
  <circle cx="1520" cy="520" r="3.5" opacity="0.35"/><circle cx="120" cy="620" r="2.5" opacity="0.4"/>
  <circle cx="420" cy="180" r="2" opacity="0.35"/><circle cx="1180" cy="880" r="3" opacity="0.3"/>
  <circle cx="330" cy="930" r="2.5" opacity="0.3"/><circle cx="980" cy="150" r="2" opacity="0.4"/>
  <circle cx="700" cy="880" r="2.5" opacity="0.28"/><circle cx="1330" cy="640" r="2" opacity="0.3"/>
</g>

<text class="h1" x="800" y="102" text-anchor="middle">粒線體：老化研究的共同節點</text>
<text class="h2" x="800" y="152" text-anchor="middle">MITOCHONDRIA · AGING HUB</text>

<!-- 連接線 -->
<g fill="none" stroke="#4f86b8" stroke-width="3.5" opacity="0.85" marker-end="url(#arw)">
  <path d="M300 400 C 420 452 470 470 560 486"/>
  <path d="M1300 400 C 1180 452 1130 470 1052 486"/>
  <path d="M300 706 C 420 668 480 650 566 622"/>
  <path d="M1300 706 C 1180 668 1120 650 1046 626"/>
</g>

<!-- 粒線體 -->
<g>
  <!-- 環境光暈與接觸陰影 -->
  <ellipse cx="804" cy="552" rx="300" ry="168" fill="#ff9a4a" opacity="0.30" filter="url(#blurOnly)"/>
  <ellipse cx="812" cy="700" rx="230" ry="26" fill="#03060f" opacity="0.55" filter="url(#blurOnly)"/>

  <!-- 外膜本體 -->
  <path d="M530 545 C530 450 610 405 720 402 C830 399 960 404 1030 440
           C1085 469 1098 545 1078 600 C1052 668 940 692 810 692
           C690 692 590 680 552 634 C530 606 530 575 530 545 Z"
        fill="url(#mitoBody)"/>

  <!-- 內部：嵴 -->
  <g clip-path="url(#bodyClip)">
    <!-- 基質底色，讓嵴有容身的深度 -->
    <path d="M530 545 C530 450 610 405 720 402 C830 399 960 404 1030 440
             C1085 469 1098 545 1078 600 C1052 668 940 692 810 692
             C690 692 590 680 552 634 C530 606 530 575 530 545 Z"
          fill="#c2632c" opacity="0.35"/>

    <g stroke="url(#crista)" stroke-width="27" stroke-linecap="round" fill="none">
      <path d="M600 386 C562 470 638 534 600 618"/>
      <path d="M672 708 C634 624 710 560 672 476"/>
      <path d="M744 386 C706 470 782 534 744 618"/>
      <path d="M816 708 C778 624 854 560 816 476"/>
      <path d="M888 386 C850 470 926 534 888 618"/>
      <path d="M960 708 C922 624 998 560 960 476"/>
      <path d="M1024 400 C986 484 1050 540 1018 612"/>
    </g>
    <!-- 嵴的受光邊：讓摺疊有厚度 -->
    <g stroke="url(#cristaEdge)" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M589 388 C551 472 627 536 589 620"/>
      <path d="M661 710 C623 626 699 562 661 478"/>
      <path d="M733 388 C695 472 771 536 733 620"/>
      <path d="M805 710 C767 626 843 562 805 478"/>
      <path d="M877 388 C839 472 915 536 877 620"/>
      <path d="M949 710 C911 626 987 562 949 478"/>
      <path d="M1013 402 C975 486 1039 542 1007 614"/>
    </g>

    <!-- 基質顆粒 -->
    <g fill="#ffdcae" opacity="0.5">
      <circle cx="640" cy="470" r="4"/><circle cx="700" cy="600" r="3.5"/>
      <circle cx="780" cy="450" r="3"/><circle cx="860" cy="590" r="4"/>
      <circle cx="930" cy="466" r="3.5"/><circle cx="990" cy="586" r="3"/>
      <circle cx="712" cy="520" r="2.5"/><circle cx="872" cy="512" r="2.5"/>
    </g>

    <!-- 體積高光 -->
    <ellipse cx="742" cy="470" rx="230" ry="112" fill="url(#mitoSheen)" transform="rotate(-9 742 470)"/>
    <!-- 底部反射光 -->
    <ellipse cx="860" cy="676" rx="200" ry="46" fill="#ffcf96" opacity="0.20" filter="url(#blurOnly)"/>
  </g>

  <!-- 外膜輪廓：外亮內細的雙線 -->
  <path d="M530 545 C530 450 610 405 720 402 C830 399 960 404 1030 440
           C1085 469 1098 545 1078 600 C1052 668 940 692 810 692
           C690 692 590 680 552 634 C530 606 530 575 530 545 Z"
        fill="none" stroke="#ffe4bd" stroke-width="5" opacity="0.95" filter="url(#bloomS)"/>
  <path d="M552 545 C552 462 622 425 722 422 C828 419 950 424 1016 458
           C1064 483 1076 545 1058 594 C1035 652 930 672 810 672
           C698 672 604 660 570 620 C551 596 552 572 552 545 Z"
        fill="none" stroke="#8e3a1e" stroke-width="2.5" opacity="0.55"/>
</g>
<text class="core" x="800" y="768" text-anchor="middle">粒線體 MITOCHONDRION</text>

<!-- 四個功能節點 -->
<g>
  <!-- 產能 -->
  <circle cx="215" cy="350" r="94" fill="url(#satFill)" stroke="#f0a94b" stroke-width="3.5" filter="url(#bloomS)"/>
  <g filter="url(#bloomS)">
    <g fill="none" stroke="#f7c470" stroke-width="4" opacity="0.85">
      <path d="M215 288 A 62 62 0 0 1 215 412"/>
      <path d="M215 412 A 62 62 0 0 1 215 288"/>
      <ellipse cx="215" cy="350" rx="62" ry="26"/>
    </g>
    <path d="M226 316 L200 356 L216 356 L204 388 L232 344 L214 344 Z" fill="#ffd98a"/>
  </g>
  <text class="lbl" x="215" y="500" text-anchor="middle">產能</text>
  <text class="sub" x="215" y="540" text-anchor="middle">電子傳遞鏈製造 ATP</text>

  <!-- 代謝樞紐 -->
  <circle cx="1385" cy="350" r="94" fill="url(#satFill)" stroke="#3fd0b4" stroke-width="3.5" filter="url(#bloomS)"/>
  <g filter="url(#bloomS)">
    <g stroke="#6fe0c8" stroke-width="3.5" fill="none" opacity="0.9">
      <path d="M1340 320 L1372 302 L1404 320 L1404 356 L1372 374 L1340 356 Z"/>
      <path d="M1404 356 L1436 374"/><path d="M1340 356 L1310 376"/>
      <path d="M1372 374 L1372 404"/>
    </g>
    <g fill="#9df0dd">
      <circle cx="1436" cy="376" r="9"/><circle cx="1308" cy="378" r="9"/><circle cx="1372" cy="406" r="9"/>
    </g>
  </g>
  <text class="lbl" x="1385" y="500" text-anchor="middle">代謝樞紐</text>
  <text class="sub" x="1385" y="540" text-anchor="middle">β 氧化與 TCA 循環</text>

  <!-- 發炎訊號 -->
  <circle cx="215" cy="755" r="94" fill="url(#satFill)" stroke="#ef6f9a" stroke-width="3.5" filter="url(#bloomS)"/>
  <g filter="url(#bloomS)">
    <!-- 外漏的環狀 mtDNA -->
    <ellipse cx="200" cy="748" rx="42" ry="30" fill="none" stroke="#ff9dbd" stroke-width="5" transform="rotate(-18 200 748)"/>
    <ellipse cx="200" cy="748" rx="24" ry="15" fill="none" stroke="#ff9dbd" stroke-width="3" opacity="0.7" transform="rotate(-18 200 748)"/>
    <g stroke="#ffc2d6" stroke-width="3.5" fill="none" opacity="0.8">
      <path d="M254 712 A 52 52 0 0 1 254 796"/>
      <path d="M272 694 A 78 78 0 0 1 272 814" opacity="0.55"/>
    </g>
  </g>
  <text class="lbl" x="215" y="900" text-anchor="middle">發炎訊號</text>
  <text class="sub" x="215" y="940" text-anchor="middle">mtDNA 外漏引發發炎</text>

  <!-- 細胞命運 -->
  <circle cx="1385" cy="755" r="94" fill="url(#satFill)" stroke="#a98ce8" stroke-width="3.5" filter="url(#bloomS)"/>
  <g filter="url(#bloomS)">
    <circle cx="1385" cy="755" r="58" fill="none" stroke="#c4aef5" stroke-width="4" opacity="0.85"/>
    <g fill="#c4aef5" opacity="0.95">
      <path d="M1362 733 a20 18 0 0 1 30 6 a18 16 0 0 1 -26 14 z"/>
      <circle cx="1408" cy="742" r="11"/>
      <circle cx="1400" cy="778" r="8"/>
      <circle cx="1368" cy="776" r="6"/>
    </g>
  </g>
  <text class="lbl" x="1385" y="900" text-anchor="middle">細胞命運</text>
  <text class="sub" x="1385" y="940" text-anchor="middle">凋亡與品質管制</text>
</g>

<text class="cap" x="800" y="828" text-anchor="middle">失智 · 肌少症 · 脂肪肝 · 心衰竭 — 論文裡反覆出現的同一個角色</text>

<!-- 全域顆粒 -->
<rect width="1600" height="1000" filter="url(#grain)" opacity="0.055" style="mix-blend-mode:overlay"/>
</svg>
