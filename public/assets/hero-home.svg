<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="資訊圖：以粒線體為中心的老化醫學研究地圖，向外連接細胞衰老、表觀遺傳時鐘、慢性發炎、老藥新用與代謝失調等主題">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#08122a"/>
    <stop offset="0.55" stop-color="#0d1e3d"/>
    <stop offset="1" stop-color="#0a1730"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2fd0b6" stop-opacity="0.28"/>
    <stop offset="1" stop-color="#2fd0b6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4fa8e8" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#4fa8e8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc9e8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc9e8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#4fc9e8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="mitoBody" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1b4a72"/>
    <stop offset="1" stop-color="#123051"/>
  </linearGradient>
  <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="12" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:60px;font-weight:800;fill:#f2f7ff;letter-spacing:2px}
  .h2{font-size:30px;font-weight:500;fill:#6fd7ea;letter-spacing:4px}
  .node{font-size:31px;font-weight:700;fill:#eaf2ff}
  .core{font-size:36px;font-weight:800;fill:#bfe9f5}
  .cap{font-size:26px;fill:#93accd}
</style>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="800" cy="580" rx="640" ry="420" fill="url(#glowA)"/>
<ellipse cx="1280" cy="240" rx="520" ry="340" fill="url(#glowB)"/>

<text class="h1" x="800" y="104" text-anchor="middle">老化醫學研究地圖</text>
<text class="h2" x="800" y="158" text-anchor="middle">GEROSCIENCE · RESEARCH MAP</text>
<rect x="420" y="188" width="760" height="3" fill="url(#rule)"/>

<!-- 連線 -->
<g fill="none" stroke="#3d8fc0" stroke-width="3" opacity="0.6">
  <path d="M800 580 L 330 400"/>
  <path d="M800 580 L 350 760"/>
  <path d="M800 580 L 1270 400"/>
  <path d="M800 580 L 1250 770"/>
  <path d="M800 580 L 800 850"/>
  <path d="M330 400 Q 800 300 1270 400" opacity="0.35"/>
</g>

<!-- 外圍節點 -->
<g>
  <circle cx="330" cy="400" r="52" fill="#102a4d" stroke="#ef6f9a" stroke-width="4" filter="url(#soft2)"/>
  <text class="node" x="330" y="330" text-anchor="middle">細胞衰老</text>

  <circle cx="350" cy="760" r="52" fill="#102a4d" stroke="#a186e0" stroke-width="4" filter="url(#soft2)"/>
  <text class="node" x="350" y="866" text-anchor="middle">表觀遺傳時鐘</text>

  <circle cx="1270" cy="400" r="52" fill="#102a4d" stroke="#f0b45a" stroke-width="4" filter="url(#soft2)"/>
  <text class="node" x="1270" y="330" text-anchor="middle">慢性發炎</text>

  <circle cx="1250" cy="770" r="52" fill="#102a4d" stroke="#2fd0b6" stroke-width="4" filter="url(#soft2)"/>
  <text class="node" x="1250" y="876" text-anchor="middle">老藥新用</text>

  <circle cx="800" cy="850" r="46" fill="#102a4d" stroke="#4fc9e8" stroke-width="4" filter="url(#soft2)"/>
  <text class="node" x="800" y="946" text-anchor="middle">代謝與營養感知</text>
</g>

<!-- 中央粒線體 -->
<g filter="url(#soft)">
  <rect x="640" y="502" width="320" height="156" rx="78" fill="url(#mitoBody)" stroke="#4fc9e8" stroke-width="4"/>
  <clipPath id="matrix"><rect x="662" y="524" width="276" height="112" rx="56"/></clipPath>
  <g clip-path="url(#matrix)">
    <rect x="662" y="524" width="276" height="112" fill="#0b2340"/>
    <g fill="none" stroke="#2fd0b6" stroke-width="9" stroke-linecap="round">
      <path d="M696 524 v74"/><path d="M736 636 v-74"/>
      <path d="M776 524 v74"/><path d="M816 636 v-74"/>
      <path d="M856 524 v74"/><path d="M896 636 v-74"/>
    </g>
  </g>
  <rect x="662" y="524" width="276" height="112" rx="56" fill="none" stroke="#2fd0b6" stroke-width="3"/>
</g>
<text class="core" x="800" y="456" text-anchor="middle">粒線體</text>
</svg>
