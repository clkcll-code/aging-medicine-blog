<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="資訊圖：左側小鼠實驗中衰老細胞被清除後健康壽命延長，右側人體試驗規模仍在數十人等級且終點指標不一致，兩者之間存在轉譯落差">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#08122a"/>
    <stop offset="0.55" stop-color="#0d1e3d"/>
    <stop offset="1" stop-color="#0a1730"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2fd0b6" stop-opacity="0.24"/>
    <stop offset="1" stop-color="#2fd0b6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ef6f9a" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#ef6f9a" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc9e8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc9e8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#4fc9e8" stop-opacity="0"/>
  </linearGradient>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:58px;font-weight:800;fill:#f2f7ff}
  .h2{font-size:30px;font-weight:500;fill:#6fd7ea;letter-spacing:3px}
  .ph{font-size:42px;font-weight:800;fill:#eaf2ff}
  .pt{font-size:26px;fill:#6fd7ea}
  .body{font-size:29px;font-weight:600;fill:#eaf2ff}
  .cap{font-size:26px;fill:#93accd}
  .gap{font-size:28px;font-weight:700;fill:#f0b45a}
</style>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="410" cy="560" rx="520" ry="400" fill="url(#glowA)"/>
<ellipse cx="1190" cy="560" rx="520" ry="400" fill="url(#glowB)"/>

<text class="h1" x="800" y="104" text-anchor="middle">Senolytics：從小鼠奇蹟到人體落差</text>
<text class="h2" x="800" y="158" text-anchor="middle">SENOLYTICS · 轉譯落差</text>
<rect x="420" y="188" width="760" height="3" fill="url(#rule)"/>

<!-- 左：小鼠 -->
<g>
  <rect x="70" y="250" width="670" height="560" rx="22" fill="#0f2140" stroke="#2fd0b6" stroke-width="3"/>
  <text class="ph" x="118" y="326">小鼠實驗</text>
  <text class="pt" x="118" y="372">2011 年起累積的動物證據</text>

  <!-- 組織中的細胞，粉紅為衰老細胞 -->
  <g>
    <circle cx="160" cy="490" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="250" cy="490" r="31" fill="#ef6f9a" filter="url(#soft2)"/>
    <circle cx="340" cy="490" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="160" cy="580" r="31" fill="#ef6f9a" filter="url(#soft2)"/>
    <circle cx="250" cy="580" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="340" cy="580" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  </g>
  <!-- 清除箭頭 -->
  <g stroke="#2fd0b6" stroke-width="6" fill="none" stroke-linecap="round" filter="url(#soft2)">
    <path d="M410 535 H 500"/>
    <path d="M478 515 L 502 535 L 478 555"/>
  </g>
  <!-- 清除後 -->
  <g>
    <circle cx="560" cy="490" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="650" cy="490" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="560" cy="580" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
    <circle cx="650" cy="580" r="31" fill="none" stroke="#4fc9e8" stroke-width="3"/>
  </g>

  <text class="body" x="118" y="700">健康壽命延長</text>
  <text class="cap" x="118" y="748">白內障、肌少症、脂肪流失皆延緩</text>
</g>

<!-- 右：人體 -->
<g>
  <rect x="860" y="250" width="670" height="560" rx="22" fill="#0f2140" stroke="#ef6f9a" stroke-width="3"/>
  <text class="ph" x="908" y="326">人體試驗</text>
  <text class="pt" x="908" y="372">2019 年起的早期臨床研究</text>

  <!-- 少量受試者 -->
  <g fill="#4fc9e8" opacity="0.9">
    <g><circle cx="945" cy="500" r="22"/><path d="M912 570 a33 40 0 0 1 66 0 z"/></g>
    <g><circle cx="1035" cy="500" r="22"/><path d="M1002 570 a33 40 0 0 1 66 0 z"/></g>
    <g><circle cx="1125" cy="500" r="22"/><path d="M1092 570 a33 40 0 0 1 66 0 z"/></g>
    <g><circle cx="1215" cy="500" r="22"/><path d="M1182 570 a33 40 0 0 1 66 0 z"/></g>
  </g>
  <text class="gap" x="1300" y="548">n ≈ 數十人</text>

  <text class="body" x="908" y="700">規模與終點都還不夠</text>
  <text class="cap" x="908" y="748">終點指標不一致，尚無臨床建議</text>
</g>

<text class="cap" x="800" y="928" text-anchor="middle">動物有效不等於人體有效 — 這是最常被跳過的一步</text>
</svg>
