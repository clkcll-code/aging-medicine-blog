<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="資訊圖：證據階梯上三種老藥的位置，rapamycin 停在動物實驗，metformin 有人體觀察資料但隨機試驗未完成，GLP-1 已有大型隨機試驗但終點是心腎而非老化">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#08122a"/>
    <stop offset="0.55" stop-color="#0d1e3d"/>
    <stop offset="1" stop-color="#0a1730"/>
  </linearGradient>
  <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#f0b45a" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#f0b45a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#4fa8e8" stop-opacity="0.24"/>
    <stop offset="1" stop-color="#4fa8e8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4fc9e8" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#4fc9e8" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#4fc9e8" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a186e0"/>
    <stop offset="0.5" stop-color="#4fc9e8"/>
    <stop offset="1" stop-color="#2fd0b6"/>
  </linearGradient>
  <filter id="soft2" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="6" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  text{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Hiragino Sans TC",system-ui,sans-serif}
  .h1{font-size:58px;font-weight:800;fill:#f2f7ff}
  .h2{font-size:30px;font-weight:500;fill:#6fd7ea;letter-spacing:3px}
  .drug{font-size:37px;font-weight:800;fill:#eaf2ff}
  .note{font-size:25px;fill:#93accd}
  .stop{font-size:31px;font-weight:700;fill:#eaf2ff}
  .cap{font-size:26px;fill:#93accd}
</style>

<rect width="1600" height="1000" fill="url(#sky)"/>
<ellipse cx="300" cy="620" rx="520" ry="380" fill="url(#glowA)"/>
<ellipse cx="1250" cy="380" rx="560" ry="380" fill="url(#glowB)"/>

<text class="h1" x="800" y="104" text-anchor="middle">三種「抗老藥」，三個證據等級</text>
<text class="h2" x="800" y="158" text-anchor="middle">METFORMIN · RAPAMYCIN · GLP-1</text>
<rect x="420" y="188" width="760" height="3" fill="url(#rule)"/>

<!-- 藥物卡 -->
<g>
  <rect x="130" y="270" width="400" height="200" rx="20" fill="#102a4d" stroke="#a186e0" stroke-width="3"/>
  <text class="drug" x="330" y="336" text-anchor="middle">Rapamycin</text>
  <text class="note" x="330" y="390" text-anchor="middle">機制最清楚</text>
  <text class="note" x="330" y="430" text-anchor="middle">人體老化資料最薄弱</text>

  <rect x="600" y="270" width="400" height="200" rx="20" fill="#102a4d" stroke="#4fc9e8" stroke-width="3"/>
  <text class="drug" x="800" y="336" text-anchor="middle">Metformin</text>
  <text class="note" x="800" y="390" text-anchor="middle">觀察性資料豐富</text>
  <text class="note" x="800" y="430" text-anchor="middle">TAME 試驗尚未完成</text>

  <rect x="1070" y="270" width="400" height="200" rx="20" fill="#102a4d" stroke="#2fd0b6" stroke-width="3"/>
  <text class="drug" x="1270" y="336" text-anchor="middle">GLP-1 促效劑</text>
  <text class="note" x="1270" y="390" text-anchor="middle">已有大型隨機試驗</text>
  <text class="note" x="1270" y="430" text-anchor="middle">但終點是心腎，非老化</text>
</g>

<!-- 垂直連接線 -->
<g stroke="#3d8fc0" stroke-width="3" opacity="0.8" stroke-dasharray="10 10">
  <path d="M330 470 V 636"/>
  <path d="M800 470 V 636"/>
  <path d="M1270 470 V 636"/>
</g>

<!-- 證據階梯軸 -->
<rect x="180" y="655" width="1240" height="7" rx="3.5" fill="url(#axis)"/>
<g filter="url(#soft2)">
  <circle cx="330" cy="658" r="21" fill="#a186e0"/>
  <circle cx="800" cy="658" r="21" fill="#4fc9e8"/>
  <circle cx="1270" cy="658" r="21" fill="#2fd0b6"/>
</g>

<text class="stop" x="330" y="738" text-anchor="middle">動物實驗</text>
<text class="stop" x="800" y="738" text-anchor="middle">人體觀察</text>
<text class="stop" x="1270" y="738" text-anchor="middle">隨機對照試驗</text>

<text class="note" x="330" y="790" text-anchor="middle">機制驗證階段</text>
<text class="note" x="800" y="790" text-anchor="middle">有關聯，未證因果</text>
<text class="note" x="1270" y="790" text-anchor="middle">證據強度最高</text>

<text class="cap" x="800" y="922" text-anchor="middle">同樣被媒體叫做「抗老藥」，站的位置差很多</text>
</svg>
